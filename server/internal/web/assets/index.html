<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c11">
<title>HomeApps</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<header class="bar">
  <div class="bar__title">
    <h1 id="title">Home</h1>
    <p class="bar__summary" id="summary"><span class="dot dot--unknown"></span>Loading…</p>
  </div>
</header>
<div class="search" id="search-wrap">
  <label class="search__box">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Search apps" aria-label="Search apps" autocomplete="off" enterkeyhint="go">
  </label>
</div>
<div class="banner" id="banner" role="status" hidden></div>
<main id="view" tabindex="-1"></main>
<nav class="tabs" aria-label="Sections">
  <a class="tabs__tab" href="#/" data-tab="apps">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Apps</a>
  <a class="tabs__tab" href="#/hosts" data-tab="hosts">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/></svg>Hosts</a>
</nav>
<dialog class="sheet" id="app-dialog" aria-labelledby="app-dialog-title">
  <form class="sheet__form" id="app-form" novalidate>
    <h2 id="app-dialog-title">Add an app</h2>
    <label class="field">Address
      <input name="url" type="text" inputmode="url" placeholder="http://nas.local:5000" autocomplete="off" autocapitalize="off" spellcheck="false" required>
    </label>
    <label class="field">Name
      <input name="name" type="text" maxlength="64" placeholder="Taken from the address if left blank" autocomplete="off">
    </label>
    <div class="field">
      <span id="app-icon-label">Icon</span>
      <div class="icon-pick" role="group" aria-labelledby="app-icon-label">
        <span id="app-icon-preview"></span>
        <label class="btn btn--small">Choose picture<input type="file" accept="image/*" data-action="icon-file" hidden></label>
        <button type="button" class="btn btn--small" data-action="icon-auto">Use the app's own</button>
      </div>
      <input name="icon_url" type="text" inputmode="url" placeholder="or a picture's address, https://…/logo.png" aria-label="Icon picture address" autocomplete="off" autocapitalize="off" spellcheck="false">
      <span class="field__hint" id="app-icon-hint"></span>
    </div>
    <p class="sheet__error" id="app-error" role="alert" hidden></p>
    <div class="sheet__actions">
      <button type="button" class="btn btn--danger" data-action="remove" hidden>Remove</button>
      <span class="sheet__spacer"></span>
      <button type="button" class="btn" data-action="cancel">Cancel</button>
      <button type="submit" class="btn btn--primary" id="app-submit">Add</button>
    </div>
  </form>
</dialog>
</body>
</html>
