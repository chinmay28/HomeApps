<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c11">
<title>HomeApps</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<header class="bar">
  <div class="bar__title">
    <h1 id="title">Home</h1>
    <p class="bar__summary" id="summary"><span class="dot dot--unknown"></span>Loading…</p>
  </div>
</header>
<div class="search" id="search-wrap">
  <label class="search__box">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Search apps" aria-label="Search apps" autocomplete="off" enterkeyhint="go">
  </label>
</div>
<div class="banner" id="banner" role="status" hidden></div>
<main id="view" tabindex="-1"></main>
<nav class="tabs" aria-label="Sections">
  <!-- The floating add button rides on the tab bar (CountRoster's pattern), so
       it always sits just above it, whatever the bar's height. -->
  <button type="button" class="fab" id="add-app" aria-label="Add an app" title="Add an app">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <a class="tabs__tab" href="#/" data-tab="apps">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Apps</a>
  <a class="tabs__tab" href="#/hosts" data-tab="hosts">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/></svg>Hosts</a>
</nav>
<!-- Outside #view, so a background redraw never touches what is being typed. -->
<dialog class="sheet" id="app-dialog" aria-labelledby="app-dialog-title">
  <form class="sheet__form" id="app-form" method="dialog" novalidate>
    <h2 id="app-dialog-title">Add an app</h2>
    <label class="field">
      <span>Address</span>
      <input id="app-url" name="url" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="pi5.local:8123" required>
    </label>
    <label class="field">
      <span>Name <em>(optional: taken from the app if left blank)</em></span>
      <input id="app-name" name="name" type="text" autocomplete="off" maxlength="64" placeholder="SAND Vault">
    </label>
    <p class="sheet__error" id="app-error" role="alert" hidden></p>
    <div class="sheet__actions">
      <button type="button" class="button button--danger" id="app-remove" hidden>Remove</button>
      <span class="sheet__spacer"></span>
      <button type="button" class="button button--quiet" id="app-cancel">Cancel</button>
      <button type="submit" class="button" id="app-save">Add</button>
    </div>
  </form>
</dialog>
</body>
</html>
